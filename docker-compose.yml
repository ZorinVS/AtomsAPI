# version: '3.9'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    command: >
      sh -c "python manage.py migrate && gunicorn --bind 0.0.0.0:8000 config.wsgi:application"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app
      - static_volume:/app/staticfiles
    ports:
      - "8000:8000"
    networks:
      - my_network
  nginx:
    build:
      context: ./nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - static_volume:/app/staticfiles
    depends_on:
      - app
    networks:
      - my_network
  db:
    image: postgres:15.10
    env_file:
      - .env
    environment:
      POSTGRES_DB: atoms_api
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB" ]
      interval: 30s
      timeout: 10s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - my_network
  redis:
    image: redis:7.4.2
    networks:
      - my_network
  celery:
    build: .
    env_file:
      - .env
    command: celery -A config worker -l INFO
    depends_on:
      - redis
      - db
    networks:
      - my_network
  celery_beat:
    build: .
    env_file:
      - .env
    command: >
      sh -c "celery -A config beat -l info -S django"
    depends_on:
      - redis
    networks:
      - my_network
volumes:
  postgres_data:
  static_volume:

networks:
  my_network:
    driver: bridge
